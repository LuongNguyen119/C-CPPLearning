<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Học lập trình C++ từ số 0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/cpp.min.js"></script>
    <link rel="stylesheet" href="cpp_app.css" />
  </head>
  <body
    class="bg-slate-50 text-slate-800 flex flex-col h-screen overflow-hidden"
  >
    <header
      class="bg-cyan-700 text-white px-4 lg:px-6 py-3 flex items-center justify-between shadow-md"
    >
      <div class="flex items-center">
        <button
          id="toggle"
          class="p-2 rounded hover:bg-cyan-800 mr-2"
          aria-label="Mở menu"
        >
          <i class="fas fa-bars"></i></button
        ><i class="fas fa-code text-2xl mr-3"></i>
        <div>
          <h1 class="font-bold text-lg leading-tight">Học lập trình C++</h1>
          <p class="text-xs text-cyan-200">150 bài học · tiếng Việt</p>
        </div>
      </div>
      <div class="flex gap-2 items-center">
        <a href="../index.html" class="home-link" title="Về trang chủ"
          ><i class="fas fa-home mr-1"></i>Trang chủ</a
        >
        <input
          id="search"
          class="text-slate-800 rounded-md px-3 py-1.5 text-sm w-48 lg:w-72"
          placeholder="Tìm bài, hàm, từ khóa..."
          aria-label="Tìm kiếm"
        /><button
          id="theme"
          class="p-2 rounded hover:bg-cyan-800"
          aria-label="Đổi giao diện"
        >
          <i class="fas fa-moon"></i></button
        ><button
          onclick="window.print()"
          class="p-2 rounded hover:bg-cyan-800"
          aria-label="In giáo trình"
        >
          <i class="fas fa-print"></i>
        </button>
      </div>
    </header>
    <div class="flex flex-1 overflow-hidden">
      <div id="backdrop" onclick="toggleSidebar()"></div>
      <aside
        id="sidebar"
        class="w-80 bg-white border-r border-slate-200 flex flex-col flex-shrink-0"
      >
        <div class="p-4 border-b border-slate-200 bg-slate-50">
          <div class="text-xs font-bold text-slate-500">TIẾN ĐỘ KHÓA HỌC</div>
          <div
            class="flex justify-between text-sm font-bold text-cyan-800 mt-1"
          >
            <span><span id="done">0</span>/<span id="total">0</span> bài</span
            ><span><span id="pct">0</span>%</span>
          </div>
          <div class="h-1.5 bg-slate-200 rounded-full mt-2">
            <div
              id="bar"
              class="h-1.5 bg-cyan-600 rounded-full"
              style="width: 0"
            ></div>
          </div>
        </div>
        <nav id="nav" class="flex-1 overflow-y-auto py-2"></nav>
        <div class="p-3 border-t text-xs text-slate-500">
          Tiến độ được lưu trên trình duyệt
        </div>
      </aside>
      <main id="scroll" class="flex-1 overflow-y-auto">
        <div id="content" class="max-w-6xl mx-auto p-5 lg:p-10"></div>
      </main>
    </div>
    <footer
      class="shrink-0 border-t border-slate-200 px-4 py-2 text-center text-xs leading-5 text-slate-500"
    >
      © 2026 C/C++ Learning · Nội dung tham khảo cấu trúc tutorial công khai;
      diễn giải và ví dụ được viết riêng - Copyright by Lương Nguyễn.
    </footer>
    <script src="cpp_lessons.js"></script>
    <script src="cpp_exercises.js"></script>
    <script src="cpp_app.js"></script>
  </body>
</html>
